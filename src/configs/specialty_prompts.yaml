specialty_determination:
  specialties:
    cardiology:
      name: "Cardiology"
      description: "Heart and cardiovascular system"
      keywords:
        [
          "chest pain",
          "heart",
          "palpitations",
          "shortness of breath",
          "high blood pressure",
          "arrhythmia",
        ]

    dermatology:
      name: "Dermatology"
      description: "Skin, hair, and nail conditions"
      keywords:
        ["rash", "acne", "mole", "skin", "eczema", "psoriasis", "hair loss"]

    orthopedics:
      name: "Orthopedics"
      description: "Bones, joints, and musculoskeletal system"
      keywords:
        [
          "joint pain",
          "back pain",
          "fracture",
          "arthritis",
          "muscle pain",
          "sports injury",
        ]

    neurology:
      name: "Neurology"
      description: "Brain, spinal cord, and nervous system"
      keywords:
        [
          "headache",
          "migraine",
          "seizure",
          "numbness",
          "memory loss",
          "dizziness",
        ]

    gastroenterology:
      name: "Gastroenterology"
      description: "Digestive system and stomach issues"
      keywords:
        [
          "stomach pain",
          "nausea",
          "diarrhea",
          "constipation",
          "acid reflux",
          "bloating",
        ]

    pulmonology:
      name: "Pulmonology"
      description: "Lungs and respiratory system"
      keywords:
        [
          "cough",
          "asthma",
          "breathing problems",
          "lung",
          "wheezing",
          "bronchitis",
        ]

    endocrinology:
      name: "Endocrinology"
      description: "Hormones and metabolic disorders"
      keywords:
        [
          "diabetes",
          "thyroid",
          "weight gain",
          "weight loss",
          "fatigue",
          "hormone",
        ]

    psychiatry:
      name: "Psychiatry"
      description: "Mental health and behavioral disorders"
      keywords:
        ["depression", "anxiety", "stress", "panic", "mood", "sleep problems"]

    ophthalmology:
      name: "Ophthalmology"
      description: "Eyes and vision"
      keywords:
        [
          "vision",
          "eye pain",
          "blurry vision",
          "eye infection",
          "glaucoma",
          "cataracts",
        ]

    otolaryngology:
      name: "ENT (Ear, Nose, Throat)"
      description: "Ear, nose, throat, and head/neck issues"
      keywords:
        ["ear pain", "hearing loss", "sore throat", "sinus", "nose", "tinnitus"]

    urology:
      name: "Urology"
      description: "Urinary system and male reproductive health"
      keywords:
        [
          "urination",
          "kidney",
          "bladder",
          "prostate",
          "urinary tract infection",
        ]

    gynecology:
      name: "Gynecology"
      description: "Women's reproductive health"
      keywords:
        ["menstrual", "pregnancy", "pelvic pain", "contraception", "menopause"]

    general_medicine:
      name: "General Medicine"
      description: "General health concerns and preventive care"
      keywords:
        ["fever", "cold", "flu", "checkup", "vaccination", "general health"]

  assessment_questions:
    location_based:
      - "Where exactly are you experiencing the symptoms?"
      - "Is the pain or discomfort localized to a specific area?"

    duration_based:
      - "How long have you been experiencing these symptoms?"
      - "Did the symptoms start suddenly or gradually?"

    severity_based:
      - "On a scale of 1-10, how would you rate your discomfort?"
      - "Are the symptoms interfering with your daily activities?"

    associated_symptoms:
      - "Are you experiencing any other symptoms along with this?"
      - "Have you noticed any patterns or triggers?"

    medical_history:
      - "Do you have any existing medical conditions?"
      - "Are you currently taking any medications?"
      - "Have you had similar symptoms before?"

  prompts:
    greeting: "I'm your specialty determination specialist. Based on your symptoms, I'll help identify the most appropriate medical specialty for your care."

    assessment_intro: "Let me ask you a few specific questions to better understand your condition and recommend the right specialist."

    specialty_recommendation: "Based on your symptoms and our assessment, I recommend seeing a {specialty_name} specialist who focuses on {specialty_description}."

    multiple_specialties: "Your symptoms could benefit from consultation with multiple specialists. I recommend starting with {primary_specialty} and potentially seeing {secondary_specialty} as well."

    general_medicine_recommendation: "For your symptoms, I recommend starting with a general medicine physician who can provide comprehensive care and refer you to specialists if needed."

    clarification_needed: "I need a bit more information to make the best recommendation. Could you tell me more about {specific_aspect}?"

    handoff_message: "Perfect! I've determined that {specialty_name} is the best fit for your needs. Let me connect you with our care coordinator to schedule your appointment."
