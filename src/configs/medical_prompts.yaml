medical_voice_agent:
  triage_agent:
    greeting:
      base_message: "Hello! I'm your medical triage assistant. I'm here to help assess your medical needs and connect you with the right care."
      call_to_action: "Could you please tell me about your symptoms or what brings you here today?"
    
    assessment_prompts:
      symptom_gathering: "Can you describe your symptoms in detail? When did they start, and how severe are they on a scale of 1-10?"
      urgency_assessment: "Based on your symptoms, I need to assess the urgency of your situation."
      follow_up_questions:
        - "Are you experiencing any chest pain or difficulty breathing?"
        - "Do you have any allergies or current medications I should know about?"
        - "Have you had similar symptoms before?"
        - "Is this getting worse, better, or staying the same?"
    
    routing_messages:
      emergency: "Based on your symptoms, this appears to be an emergency situation. I'm going to connect you with emergency services immediately."
      high_urgency: "Your symptoms indicate you need urgent medical attention. I'll help you schedule an appointment within 24 hours."
      medium_urgency: "I recommend scheduling an appointment within the next 2-3 days. Let me transfer you to our support team."
      low_urgency: "This seems like something that can be addressed with a routine appointment. I'll connect you with our support team."
      transfer_to_support: "I'm now transferring you to our medical support specialist who can help with scheduling and next steps."

  support_agent:
    greeting:
      base_message: "Hi! I'm your medical support specialist. I'm here to help with appointments, prescriptions, and connecting you with the right healthcare professionals."
      from_triage: "I've received your information from our triage team. Let me help you with the next steps."
    
    appointment_scheduling:
      availability_check: "Let me check availability for {department} appointments. What's your preferred date and time?"
      confirmation: "I've scheduled your appointment with {doctor_name} on {date} at {time}. You'll receive a confirmation shortly."
      alternatives: "That time isn't available. Here are some alternative options: {alternatives}"
    
    prescription_handling:
      refill_inquiry: "I can help with prescription refills. What medication do you need refilled?"
      refill_approved: "Your prescription refill has been approved and is ready for pickup at {pharmacy}."
      refill_denied: "This refill requires doctor approval. I can schedule an appointment for you to discuss this with your physician."
    
    professional_recommendations:
      general_inquiry: "Based on your needs, I recommend seeing a {specialization} specialist. Here are some available options:"
      specialist_info: "Dr. {name} specializes in {specialization} and has availability on {dates}. Would you like me to schedule an appointment?"

  billing_agent:
    greeting:
      base_message: "Hello! I'm your billing and subscription specialist. I can help with subscription management, payments, and billing questions."
      call_to_action: "How can I assist you with your account today?"
    
    subscription_management:
      current_status: "Your current subscription is {subscription_type} with {features}. Your next billing date is {next_billing}."
      upgrade_options: "I can upgrade you to {new_plan} which includes {additional_features} for ${monthly_fee} per month."
      cancellation: "I understand you'd like to cancel. Can I help address any concerns or show you other options first?"
    
    payment_processing:
      payment_confirmation: "Your payment of ${amount} has been processed successfully. You'll receive a receipt shortly."
      payment_failed: "There was an issue processing your payment. Let me help you update your payment method."
      billing_inquiry: "I can see your billing history and help resolve any questions about charges."

  error_messages:
    system_error: "I'm experiencing a technical issue. Let me connect you with a human representative."
    information_missing: "I need a bit more information to help you properly. Could you provide {missing_info}?"
    transfer_failed: "I'm having trouble transferring you. Please hold while I get additional assistance."
    appointment_unavailable: "I don't see any available appointments for that time. Let me suggest some alternatives."

  general_responses:
    acknowledgment:
      - "I understand."
      - "Thank you for that information."
      - "Let me help you with that."
      - "I can assist you with that."
    
    clarification:
      - "Could you clarify what you mean by {unclear_term}?"
      - "I want to make sure I understand correctly. Are you saying {confirmation}?"
      - "Can you provide more details about {topic}?"
    
    empathy:
      - "I understand this can be concerning."
      - "I'm here to help you through this."
      - "Let's work together to resolve this."
      - "I appreciate your patience."

  conversation_flow:
    triage_to_support: "Thank you for the assessment. I'm now connecting you with our support team who will help with scheduling and next steps."
    triage_to_billing: "I'm transferring you to our billing specialist who can help with subscription and payment questions."
    support_to_billing: "For billing questions, let me connect you with our billing specialist."
    end_conversation: "Is there anything else I can help you with today? Thank you for choosing our medical services."